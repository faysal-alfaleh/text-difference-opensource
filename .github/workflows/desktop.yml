name: Desktop

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build installers for
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            asset-name: Text-Diff-macOS[ext]
          - runner: windows-latest
            rust-targets: ""
            args: ""
            asset-name: Text-Diff-Windows[setup][ext]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: bun install --frozen-lockfile

      - id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          {
            echo "body<<RELEASE_NOTES_END"
            gh release view "$TAG" --json body --jq .body --repo "$GITHUB_REPOSITORY"
            echo "RELEASE_NOTES_END"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          tauriScript: bun run tauri
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json
          releaseAssetNamePattern: ${{ matrix.asset-name }}
          uploadUpdaterJson: true
